# Netlify 설정: Git 저장소를 연결해 배포할 때 사용한다.
# (dist 폴더를 끌어다 놓는 Netlify Drop 방식이면 이 파일은 쓰이지 않는다.)
[build]
  command = "pip install -r requirements.txt && python build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"

# 3D 모델·그림은 오래 캐시해도 된다
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
