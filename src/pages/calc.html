<div class="tool-page">
<h1>계산기</h1>
<p class="intro">값을 넣으면 바로 계산된다. 각 계산기의 근거는 본문의 해당 장에 있다.</p>

<section class="panel" id="led">
  <h2>LED 전류 (2장)</h2>
  <div class="grid2">
    <label class="field"><span>전원 전압 (V)</span><input type="number" id="led-v" value="5" step="0.1"></label>
    <label class="field"><span>LED 전압 (V)<small>적색·황색 약 2, 백색 약 3</small></span><input type="number" id="led-vf" value="2" step="0.1"></label>
    <label class="field"><span>저항 (Ω)</span><input type="number" id="led-r" value="220" step="1"></label>
  </div>
  <p class="result">전류 <strong id="led-i">-</strong> mA · <span id="led-judge"></span></p>
</section>

<section class="panel" id="blink">
  <h2>점멸 주기 (3장)</h2>
  <div class="grid2">
    <label class="field"><span>점등·소등 시간 T (ms)</span><input type="number" id="bl-t" value="400" step="10"></label>
  </div>
  <p class="result">1분당 <strong id="bl-n">-</strong>회 · <span id="bl-judge"></span></p>
  <p class="desc">기준: 1분에 60~120회. 1분당 횟수 = 60,000 ÷ 2T</p>
</section>
</div>
